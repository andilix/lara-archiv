<style>
:root{color-scheme:light dark;--bg:light-dark(#fbf6f6,#140a0b);--card:light-dark(#fff,#1f1214);--ink:light-dark(#241517,#f5eeee);--muted:light-dark(#6d5f61,#bcaeb0);--line:light-dark(#eadfe0,#3a2729);--red:#C3122B}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 40px rgba(110,10,20,.15)}
.top{background:linear-gradient(140deg,#6E0A14,#A3121F 55%,#D9412F);color:#fff;padding:28px 24px 24px;position:relative;overflow:hidden}
.top b{position:absolute;right:14px;top:-18px;font-size:120px;font-weight:800;opacity:.12;line-height:1}
.top small{font-weight:800;font-size:12px;letter-spacing:.08em;opacity:.85}
.top h1{margin:4px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.02em}
form{padding:22px 24px 24px;display:grid;gap:12px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--muted)}
button{font:inherit;font-weight:800;font-size:16px;padding:13px;border:0;border-radius:14px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.3em;color:var(--red);font-size:14px;margin:0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0 24px 18px}
</style></head><body>
